name: Daily data update

on:
  schedule:
    # 06:00 UTC daily — after LMSAL has posted its 00:01 snapshot
    - cron: '0 6 * * *'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to commit the refreshed data back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record starting counts
        id: before
        # the files don't exist before the first run that creates them, so a missing file counts as 0
        run: |
          for name in events noaa_events sciquality_events; do
            echo "$name=$(python -c "import json,os,sys;p=sys.argv[1];print(len(json.load(open(p))) if os.path.exists(p) else 0)" "data/$name.json")" >> "$GITHUB_OUTPUT"
          done

      - name: Scrape LMSAL events
        run: python pipeline/daily_scraper.py

      - name: Add LMSAL event links
        # the scraper records each new event's own page; this fills in any it missed (only those are fetched)
        run: python pipeline/lmsal_links.py

      - name: Download NOAA event files
        # NOAA's FTP server is occasionally unreachable. A miss is harmless — the next run
        # retries every date it is still missing — so don't fail the whole workflow over it.
        continue-on-error: true
        run: python pipeline/noaa_downloader.py

      - name: Download SciQuality report
        # NCEI republishes the whole report daily; a miss keeps yesterday's file, so don't fail over it
        continue-on-error: true
        run: python pipeline/sciquality_downloader.py

      - name: Build SciQuality events
        run: python pipeline/sciquality_events.py

      - name: Assign quality flags (LMSAL and NOAA, against each other)
        run: python pipeline/noaa_matcher.py

      - name: Add pixel coordinates
        run: python pipeline/coordinates.py

      - name: Verify the data did not shrink
        # the pipeline only ever adds events, so a drop means something parsed wrong
        # (an LMSAL layout change, a truncated download) and must not be committed
        run: |
          check() {
            AFTER=$(python -c "import json,sys;print(len(json.load(open(sys.argv[1]))))" "data/$1.json")
            echo "$1: $2 -> $AFTER"
            if [ "$AFTER" -lt "$2" ]; then
              echo "::error::$1 count dropped from $2 to $AFTER — refusing to commit."
              exit 1
            fi
          }
          check events ${{ steps.before.outputs.events }}
          check noaa_events ${{ steps.before.outputs.noaa_events }}
          check sciquality_events ${{ steps.before.outputs.sciquality_events }}

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/events.json data/noaa_events.json data/sciquality_events.json data/goes_sciquality data/noaa_data data/noaa_unavailable.txt
          if git diff --staged --quiet; then
            echo "No new data today."
            exit 0
          fi
          COUNT=$(python -c 'import json;print(len(json.load(open("data/events.json"))))')
          LATEST=$(python -c 'import json;print(max(e["event_start"][:10] for e in json.load(open("data/events.json"))))')
          git commit -m "Daily data update: $COUNT events, latest $LATEST"
          git push
